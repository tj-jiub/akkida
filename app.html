<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>악기다</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-gov-dynamic-subset.min.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<style>
/* 휴대폰 한 대 안에서 앱 전체가 돈다. 데스크톱에서는 아이폰 크기 틀, 휴대폰에서는 화면 전체 */
:root{--frame:#1e2124;--ease:cubic-bezier(.2,.7,.2,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--frame:#33363d}}
:root[data-theme="dark"]{--frame:#33363d}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:17px;line-height:1.5;word-break:keep-all;display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
button{font:inherit;color:inherit}
.phone{width:min(390px,100%);height:min(844px,calc(100vh - 32px));min-height:600px;background:var(--surface);border:10px solid var(--frame);border-radius:52px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.statusbar{height:44px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-size:15px;font-weight:700}
.statusbar .island{width:110px;height:30px;border-radius:20px;background:#000}
.homebar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--text);opacity:.85;z-index:30;pointer-events:none}

.viewport{flex:1;position:relative;overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--surface);transition:transform .45s var(--ease),opacity .45s var(--ease)}
.scr.in-r{transform:translateX(100%)}
.scr.in-l{transform:translateX(-30%);opacity:.6}
.scr.fade{opacity:0}
.scr.out-r{transform:translateX(100%)}
.scr.behind{transform:translateX(-30%);opacity:.6}
.navbar{flex:none;height:48px;display:flex;align-items:center;gap:4px;padding:0 8px}
.navbar .ttl{flex:1;font-weight:700;font-size:17px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--text);flex:none}
.icon-btn:disabled{visibility:hidden}
.icon-btn:focus-visible,.row:focus-visible,.tab:focus-visible,.song:focus-visible,.chip:focus-visible{outline:2px solid var(--action);outline-offset:2px}
.text-btn{border:0;background:transparent;color:var(--action);font-weight:700;font-size:15px;min-height:44px;padding:0 8px;cursor:pointer}
.text-btn.sub{color:var(--text-sub);font-weight:400}
.body{flex:1;overflow-y:auto;padding:0 24px 24px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
.body.tight{gap:8px}
.foot{flex:none;padding:12px 24px 28px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.large{font-size:28px;line-height:1.4;font-weight:700;margin:4px 0 0}
.q{font-size:26px;line-height:1.4;font-weight:700;margin:12px 0 0;text-wrap:balance}
.hint{font-size:15px;color:var(--text-sub);margin:0}
.cap{font-size:13px;color:var(--text-sub)}
.sec{font-size:15px;font-weight:700;color:var(--text-sub);margin:8px 0 0}
.num{font-variant-numeric:tabular-nums}
.ic{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 목록 */
.card{border:1px solid var(--line-light);border-radius:var(--radius-12);background:var(--surface);display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px;border:0;background:transparent;text-align:left;width:100%;cursor:pointer;color:var(--text)}
.row+.row{border-top:1px solid var(--line-light)}
.row .main{flex:1;display:flex;flex-direction:column;min-width:0}
.row .main small{font-size:13px;color:var(--text-sub)}
.row .chev{color:var(--text-sub)}
.song{border:1px solid var(--line-light);border-radius:var(--radius-12);padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--surface);text-align:left;cursor:pointer;width:100%;color:var(--text)}
.song .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.song b{font-size:17px}
.song .ak-badge{flex:none;white-space:nowrap}
.meter{height:6px;border-radius:var(--radius-pill);background:var(--line-light);overflow:hidden}
.meter i{display:block;height:100%;background:var(--action);border-radius:var(--radius-pill)}
.team{background:var(--subtle);border:1px solid var(--subtle-line);border-radius:var(--radius-12);padding:16px;display:flex;flex-direction:column;gap:4px}
.team b{font-size:19px;color:var(--subtle-text)}
.team span{font-size:15px;color:var(--subtle-text)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface-2);border-radius:var(--radius-8);padding:8px 12px}
.kpi span{display:block;font-size:13px;color:var(--text-sub)}
.kpi b{font-size:19px}
.bars{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.bars .ak-bar{width:auto;min-height:48px}
canvas{width:100%;height:150px;display:block}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 16px;border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--surface);cursor:pointer;font-size:15px}
.chip[aria-pressed="true"]{background:var(--text);color:var(--surface);border-color:var(--text);font-weight:700}

/* 온보딩 */
.opts{display:flex;flex-direction:column;gap:8px}
.opts.grid{display:grid;grid-template-columns:1fr 1fr}
.progress-wrap{flex:1;margin-right:12px}
.hero-ic{width:88px;height:88px;border-radius:24px;background:var(--action-bg);color:var(--action);display:grid;place-items:center;margin:24px 0 0}
.bullets{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px;font-size:15px}
.bullets li{display:flex;gap:8px}
.bullets li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--action);margin-top:9px;flex:none}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:15px;color:var(--text-sub)}
.field input{min-height:56px;border:1px solid var(--line);border-radius:var(--radius-12);padding:0 16px;font:inherit;font-size:19px;background:var(--surface);color:var(--text)}
.field input:focus-visible{outline:2px solid var(--action);outline-offset:1px}
.dday{font-size:15px;color:var(--action);font-weight:700;min-height:22px}

/* 녹음 */
.rec-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.count{font-size:64px;font-weight:700;line-height:1;min-height:64px}
.wave{width:100%;height:56px;display:flex;align-items:center;gap:2px}
.wave i{flex:1;background:var(--subtle-text);border-radius:1px;opacity:.35;transition:opacity .2s}
.wave i.on{opacity:1;background:var(--action)}
.rec-btn{width:80px;height:80px;border-radius:50%;border:4px solid var(--text);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.rec-btn span{width:32px;height:32px;border-radius:50%;background:var(--late-mark);transition:border-radius .3s,width .3s,height .3s}
.rec-btn.on span{width:26px;height:26px;border-radius:6px}
.timer{font-size:19px;font-weight:700}

/* 탭 바 */
.tabbar{flex:none;display:flex;border-top:1px solid var(--line-light);background:var(--surface);padding:4px 8px 24px}
.tab{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;font-size:11px;color:var(--text-sub);cursor:pointer}
.tab[aria-current="page"]{color:var(--action);font-weight:700}

/* 시트, 토스트 */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:20;opacity:0;transition:opacity .3s}
.dim.on{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:var(--radius-12) var(--radius-12) 0 0;padding:8px 24px 32px;z-index:21;transform:translateY(100%);transition:transform .45s var(--ease);display:flex;flex-direction:column;gap:12px;max-height:85%;overflow-y:auto}
.sheet.on{transform:none}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.sheet h2{font-size:22px;margin:0}
.sheet textarea{min-height:96px;border:1px solid var(--line);border-radius:var(--radius-12);padding:12px;font:inherit;background:var(--surface);color:var(--text);resize:none}
.sheet textarea:focus-visible{outline:2px solid var(--action);outline-offset:1px}
.linkbox{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--radius-12);padding:8px 8px 8px 16px;font-size:15px}
.linkbox span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--text);color:var(--surface);border-radius:var(--radius-8);padding:12px 16px;font-size:15px;z-index:40;text-align:center}
.spin{width:40px;height:40px;border-radius:50%;border:4px solid var(--line-light);border-top-color:var(--action);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* 악보 */
.kstage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:4px;min-height:200px}
.staff{width:100%;height:auto;display:block;overflow:visible}
.staff .ln{stroke:var(--text-sub);stroke-width:1}
.staff .bl{stroke:var(--text);stroke-width:1.2}
.staff .hd{fill:var(--text)}
.staff .hd.open{fill:none;stroke:var(--text);stroke-width:1.4}
.staff .st{stroke:var(--text);stroke-width:1.2;fill:none}
.staff .clef{fill:none;stroke:var(--text);stroke-width:1.6}
.staff .dot{fill:var(--text)}
.staff .hi{fill:var(--action-bg)}
.staff .ph{stroke:var(--action);stroke-width:2}
.staff .ly{fill:var(--text);font-size:11px;font-family:var(--font-sans)}
.staff .no{fill:var(--text-sub);font-size:9px;font-family:var(--font-sans)}
.staff.next{opacity:.4}
.time{display:flex;justify-content:space-between;font-size:13px;color:var(--text-sub)}
.body .ak-progress{flex:none}

/* 기준 음량 */
.meter-wrap{display:flex;gap:12px;justify-content:center;align-items:stretch;margin-top:8px}
.lvmeter{position:relative;height:200px;width:72px;border-radius:var(--radius-12);background:var(--surface-2);overflow:hidden;border:1px solid var(--line-light)}
.lvmeter .zone{position:absolute;left:0;right:0;bottom:50%;height:27%;background:var(--ok-bg);border-top:2px solid var(--ok);border-bottom:2px solid var(--ok)}
.lvmeter .clip{position:absolute;left:0;right:0;top:0;height:10%;background:var(--late-bg)}
.lvmeter .lvl{position:absolute;left:14px;right:14px;bottom:0;height:0;background:var(--action);border-radius:6px 6px 0 0}
.scale{display:flex;flex-direction:column;justify-content:space-between;font-size:13px;color:var(--text-sub);padding:4px 0 32%}
.scale .z{color:var(--ok);font-weight:700}
.lvl-msg{display:flex;gap:8px;align-items:center;justify-content:center;font-weight:700;text-align:center;min-height:48px;color:var(--text-sub)}
.lvl-msg.good{color:var(--ok)}
.lvl-msg.bad{color:var(--late)}

/* 점수 */
.score{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:300px}
.score .big{font-size:96px;line-height:1;font-weight:700}
.score .big small{font-size:28px}
.score .say{font-size:19px;margin:12px 0 4px}
.cap .ic,.hint .ic{vertical-align:-3px}
.more{font-size:15px;color:var(--text-sub);border-top:1px solid var(--line-light);padding-top:8px}
.more summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
.more ul{margin:0;padding-left:18px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sheet .row.card{border:1px solid var(--line-light);border-radius:var(--radius-12)}

/* 믹서 */
.mix{display:flex;flex-direction:column;gap:16px}
.mrow{display:grid;grid-template-columns:72px 1fr 36px;gap:10px;align-items:center;font-size:15px}
.mrow small{display:block;font-size:13px;color:var(--text-sub)}
.mrow output{font-size:13px;color:var(--text-sub);text-align:right;font-variant-numeric:tabular-nums}
.mtrack{display:flex;flex-direction:column;gap:2px}
.mtrack input{width:100%;accent-color:var(--action);min-height:32px;margin:0}
.ref{position:relative;height:4px;border-radius:2px;background:var(--line-light)}
.ref i{position:absolute;top:-4px;width:2px;height:12px;background:var(--ok)}

@media (max-width:480px){
  body{padding:0}
  .statusbar,.homebar{display:none}
  .phone{width:100%;height:100vh;height:100dvh;min-height:0;border:0;border-radius:0;padding-top:env(safe-area-inset-top,0px)}
  .tabbar{padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
  .foot{padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){.scr,.sheet,.dim{transition:none}.spin{animation-duration:3s}}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="statusbar" aria-hidden="true"><span id="clock">9:41</span><span class="island"></span><span>100%</span></div>
  <div class="viewport" id="vp"></div>
  <nav class="tabbar" id="tabbar" hidden aria-label="탭">
    <button class="tab" type="button" data-tab="home"><svg class="ic" width="24" height="24" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg>합주</button>
    <button class="tab" type="button" data-tab="record"><svg class="ic" width="24" height="24" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>내 기록</button>
    <button class="tab" type="button" data-tab="me"><svg class="ic" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/></svg>내 정보</button>
  </nav>
  <div class="homebar" aria-hidden="true"></div>
</div>
<script type="module" src="js/phone.js"></script>
</body>
</html>
