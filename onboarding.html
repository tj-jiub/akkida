<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>악기다 — 앱 온보딩</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-gov-dynamic-subset.min.css">
<link rel="stylesheet" href="css/tokens.css">
<style>
:root{--frame:#1e2124;--ease:cubic-bezier(.2,.7,.2,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--frame:#33363d}}
:root[data-theme="dark"]{--frame:#33363d}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:17px;line-height:1.5;word-break:keep-all;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px}
.caption{font-size:15px;color:var(--text-sub);text-align:center;max-width:46ch;margin:0}
.phone{width:min(390px,100%);height:min(844px,calc(100vh - 120px));min-height:640px;background:var(--surface);border:10px solid var(--frame);border-radius:52px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.status{height:44px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-size:15px;font-weight:700}
.status .island{width:110px;height:30px;border-radius:20px;background:#000}
.topbar{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px}
.back{width:44px;height:44px;border:0;background:transparent;color:var(--text);border-radius:12px;display:grid;place-items:center;cursor:pointer}
.back:disabled{visibility:hidden}
.back svg,.opt svg,.hero-ic svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.progress{flex:1;height:4px;border-radius:1000px;background:var(--line-light);overflow:hidden;margin-right:12px}
.progress i{display:block;height:100%;background:var(--action);border-radius:1000px;transition:width .6s var(--ease)}
.skip{border:0;background:transparent;color:var(--text-sub);font:inherit;font-size:15px;min-height:44px;padding:0 8px;cursor:pointer}

.viewport{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:8px 24px 0;overflow-y:auto;transition:transform .6s var(--ease),opacity .6s var(--ease)}
.screen.enter-r{transform:translateX(24px);opacity:0}
.screen.enter-l{transform:translateX(-24px);opacity:0}
.screen.leave{opacity:0}
.q{font-size:26px;line-height:1.4;font-weight:700;margin:12px 0 8px;text-wrap:balance}
.hint{font-size:15px;color:var(--text-sub);margin:0 0 24px}
.opts{display:flex;flex-direction:column;gap:8px;padding-bottom:24px}
.opts.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:60px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font:inherit;text-align:left;cursor:pointer;transition:background .2s,border-color .2s}
.opt .em{width:28px;height:28px;flex:none;color:var(--text-sub)}
.opt .txt{flex:1;display:flex;flex-direction:column}
.opt .txt small{font-size:13px;color:var(--text-sub)}
.opt .ck{width:24px;height:24px;flex:none;border-radius:50%;border:1.6px solid var(--line);display:grid;place-items:center;color:transparent}
.opt[aria-pressed="true"]{border-color:var(--action);background:var(--action-bg)}
.opt[aria-pressed="true"] .em{color:var(--action)}
.opt[aria-pressed="true"] .ck{background:var(--action);border-color:var(--action);color:var(--action-text)}
.opts.grid .opt{flex-direction:column;align-items:flex-start;min-height:96px;position:relative}
.opts.grid .opt .ck{position:absolute;top:12px;right:12px}
.opt:focus-visible,.cta:focus-visible,.back:focus-visible,.skip:focus-visible,.date input:focus-visible{outline:2px solid var(--action);outline-offset:2px}

.date{display:flex;flex-direction:column;gap:8px;padding-bottom:16px}
.date label{font-size:15px;color:var(--text-sub)}
.date input{min-height:56px;border:1px solid var(--line);border-radius:12px;padding:0 16px;font:inherit;font-size:19px;background:var(--surface);color:var(--text)}
.dday{font-size:15px;color:var(--action);font-weight:700;min-height:22px}

.hero-ic{width:96px;height:96px;border-radius:24px;background:var(--action-bg);color:var(--action);display:grid;place-items:center;margin:32px 0 8px}
.bullets{list-style:none;padding:0;margin:0 0 24px;display:flex;flex-direction:column;gap:12px;font-size:15px}
.bullets li{display:flex;gap:8px}
.bullets li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--action);margin-top:9px;flex:none}
.sys{border-radius:14px;background:var(--bg);padding:16px;font-size:13px;color:var(--text-sub);text-align:center}
.sys b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}

.summary{border:1px solid var(--line-light);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;font-size:15px;margin-bottom:16px}
.summary div{display:flex;justify-content:space-between;gap:12px}
.summary span{color:var(--text-sub)}
.summary b{text-align:right}

.bottom{flex:none;padding:12px 24px calc(20px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--surface) 24%);display:flex;flex-direction:column;gap:8px}
.cta{min-height:56px;border:0;border-radius:12px;background:var(--action);color:var(--action-text);font:inherit;font-weight:700;font-size:17px;cursor:pointer;transition:background .2s}
.cta:hover{background:var(--action-hover)}
.cta:disabled{background:var(--disabled-bg);color:var(--disabled-text);cursor:not-allowed}
.cta.ghost{background:transparent;color:var(--text-sub);min-height:44px;font-weight:400}
.home{width:134px;height:5px;border-radius:3px;background:var(--text);opacity:.85;margin:0 auto 8px;flex:none}

.answers{width:min(390px,100%);font-size:13px;color:var(--text-sub);background:var(--surface);border:1px solid var(--line-light);border-radius:12px;padding:12px 16px}
.answers b{color:var(--text)}
@media (max-width:480px){
  body{padding:0}
  .stage{gap:0}
  .caption,.answers,.status,.home{display:none}
  .phone{width:100%;height:100vh;height:100dvh;min-height:0;border:0;border-radius:0}
}
@media (prefers-reduced-motion:reduce){.screen,.progress i{transition:none}}
.backlink{width:min(390px,100%);font-size:15px}
@media (max-width:480px){.backlink{display:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-vocal" viewBox="0 0 24 24"><circle cx="9" cy="9" r="5"/><path d="M12.5 12.5L20 20"/></symbol>
  <symbol id="i-guitar" viewBox="0 0 24 24"><path d="M14 10l6-6M18 2l4 4M10.5 9.5a4 4 0 0 0-5.6.4c-1.4 1.6-.4 3.1-1.9 4.6-1.5 1.5 1 6 5.5 5.5 1.5-1.5 3-0.5 4.6-1.9a4 4 0 0 0 .4-5.6z"/><circle cx="9" cy="15" r="1.2"/></symbol>
  <symbol id="i-bass" viewBox="0 0 24 24"><path d="M15 9l6-6M10.5 9.5a4 4 0 0 0-5.6.4c-1.4 1.6-.4 3.1-1.9 4.6-1.5 1.5 1 6 5.5 5.5 1.5-1.5 3-0.5 4.6-1.9a4 4 0 0 0 .4-5.6zM7 14l3 3"/></symbol>
  <symbol id="i-drum" viewBox="0 0 24 24"><ellipse cx="12" cy="9" rx="8" ry="3"/><path d="M4 9v7c0 1.7 3.6 3 8 3s8-1.3 8-3V9M8 3l3 5M16 3l-3 5"/></symbol>
  <symbol id="i-keys" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M8 5v9M12 5v9M16 5v9M8 14v5M12 14v5M16 14v5"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><path d="M6 12h.01M12 12h.01M18 12h.01"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-solo" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-won" viewBox="0 0 24 24"><path d="M4 7l3.5 11L12 8l4.5 10L20 7M3 11h18M3 14h18"/></symbol>
  <symbol id="i-q" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17v.01"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6v.01M4.5 12v.01M4.5 18v.01"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></symbol>
</svg>

<div class="stage">
  <p class="backlink"><a href="./" style="color:var(--action)">← 악기다 홈</a></p>
  <p class="caption">악기다 iOS 앱 온보딩 목업입니다. 질문 하나에 화면 하나, 답하면 아래 버튼이 켜집니다.</p>
  <div class="phone" role="application" aria-label="악기다 온보딩">
    <div class="status" aria-hidden="true"><span>9:41</span><span class="island"></span><span>100%</span></div>
    <div class="topbar">
      <button class="back" id="back" type="button" aria-label="이전 질문"><svg width="24" height="24"><use href="#i-back"/></svg></button>
      <div class="progress" role="progressbar" aria-label="진행" aria-valuemin="0" aria-valuemax="100"><i id="bar" style="width:0"></i></div>
      <button class="skip" id="skip" type="button" hidden>건너뛰기</button>
    </div>
    <div class="viewport" id="vp"></div>
    <div class="bottom">
      <button class="cta" id="cta" type="button" disabled>다음</button>
      <button class="cta ghost" id="cta2" type="button" hidden></button>
    </div>
    <div class="home" aria-hidden="true"></div>
  </div>
  <div class="answers" id="answers" aria-live="polite"><b>지금까지 답한 것</b> · 아직 없음</div>
</div>

<script>
(function(){
  var A = {}; // 답
  var icon = function(id, size){ return '<svg class="em" width="'+(size||28)+'" height="'+(size||28)+'"><use href="#'+id+'"/></svg>'; };
  var ck = '<span class="ck"><svg width="16" height="16" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><use href="#i-check"/></svg></span>';

  var S = [
    { id:"instrument", multi:true, grid:true,
      q:"어떤 악기를 연주하세요?", hint:"여러 개를 골라도 돼요. 합주할 때 내 파트 자리가 미리 정해져요.",
      opts:[["vocal","보컬","i-vocal"],["guitar","기타","i-guitar"],["bass","베이스","i-bass"],["drum","드럼","i-drum"],["keys","건반","i-keys"],["etc","그 밖의 악기","i-more"]] },
    { id:"career", q:"연주한 지 얼마나 됐나요?", hint:"분석 결과를 설명하는 말투를 맞춰 드려요.",
      opts:[["lt1","1년이 안 됐어요"],["1to3","1~3년"],["3to5","3~5년"],["gt5","5년 넘었어요"]] },
    { id:"band", q:"지금 밴드에서 활동하고 있나요?",
      opts:[["club","네, 동아리 밴드예요","i-users","정기공연을 준비하는 학교·연합 동아리"],["crew","네, 직장인·친구 밴드예요","i-users","합주실을 빌려 모이는 팀"],["seek","아니요, 팀을 찾고 있어요","i-search","빈 파트를 구하는 곳에 들어가고 싶어요"],["solo","혼자 연습하고 있어요","i-solo","팀 없이 개인 연습부터"]] },
    { id:"show", q:"준비하는 공연이 있나요?", hint:"공연 날짜를 알려주시면 곡별 준비 상태를 D-day에 맞춰 보여드려요.",
      when:function(){ return A.band==="club"||A.band==="crew"; }, date:true,
      opts:[["yes","네, 날짜가 정해졌어요","i-cal"],["no","아직 없어요"]] },
    { id:"pain", q:"합주할 때 가장 아쉬운 건 뭔가요?", hint:"하나만 골라 주세요. 이 답으로 다음에 만들 기능을 정해요.",
      opts:[["time","멤버끼리 시간 맞추기가 어려워요","i-clock"],["cost","합주실 비용과 시간이 아까워요","i-won"],["who","누가 어디서 틀렸는지 모르겠어요","i-q"],["songs","연습할 곡이 많아 정리가 안 돼요","i-list"]] },
    { id:"mic", perm:true, icon:"i-mic", q:"녹음하려면 마이크가 필요해요",
      bullets:["기준 트랙을 이어폰으로 들으며 내 파트만 녹음해요","녹음은 팀에게만 보여요. 공개는 내가 고를 때만","영상은 찍지 않아요. 소리만 녹음해요"],
      sys:"<b>‘악기다’에서 마이크에 접근하려고 합니다</b>실제 앱에서는 이 다음에 iOS 권한 창이 떠요",
      cta:"마이크 허용하기", cta2:"나중에 할게요" },
    { id:"push", perm:true, icon:"i-bell", q:"새 파트가 올라오면 알려드릴까요?",
      bullets:["팀원이 녹음을 올리면 바로 합주를 들을 수 있어요","밀린 마디에 메모가 달리면 알려드려요","광고 알림은 보내지 않아요"],
      sys:"<b>‘악기다’에서 알림을 보내고자 합니다</b>실제 앱에서는 이 다음에 iOS 권한 창이 떠요",
      cta:"알림 받기", cta2:"나중에 할게요" },
    { id:"done", done:true }
  ];

  var vp = document.getElementById("vp"), cta = document.getElementById("cta"), cta2 = document.getElementById("cta2"),
      back = document.getElementById("back"), bar = document.getElementById("bar"), skip = document.getElementById("skip");
  var history = [], cur = 0, el = null;

  function visible(i){ return !S[i].when || S[i].when(); }
  function nextIndex(i){ do { i++; } while (i < S.length && !visible(i)); return i; }
  function label(step, key){ var o = step.opts.filter(function(x){ return x[0]===key; })[0]; return o ? o[1] : key; }

  function body(s){
    var h = "";
    if (s.done) return doneScreen();
    if (s.perm) {
      h += '<div class="hero-ic"><svg width="48" height="48"><use href="#'+s.icon+'"/></svg></div>';
      h += '<h1 class="q">'+s.q+'</h1><ul class="bullets">'+s.bullets.map(function(b){ return "<li>"+b+"</li>"; }).join("")+'</ul>';
      h += '<div class="sys">'+s.sys+'</div>';
      return h;
    }
    h += '<h1 class="q">'+s.q+'</h1>' + (s.hint ? '<p class="hint">'+s.hint+'</p>' : '<p class="hint"></p>');
    h += '<div class="opts'+(s.grid?' grid':'')+'" role="group" aria-label="'+s.q+'">';
    s.opts.forEach(function(o){
      var on = s.multi ? (A[s.id]||[]).indexOf(o[0])>=0 : A[s.id]===o[0];
      h += '<button class="opt" type="button" data-k="'+o[0]+'" aria-pressed="'+on+'">'+(o[2]?icon(o[2]):'')+
           '<span class="txt">'+o[1]+(o[3]?'<small>'+o[3]+'</small>':'')+'</span>'+ck+'</button>';
    });
    h += '</div>';
    if (s.date) h += '<div class="date" id="datebox" '+(A.show==="yes"?'':'hidden')+'><label for="show-date">공연 날짜</label><input id="show-date" type="date" value="'+(A.showDate||'')+'"><div class="dday" id="dday"></div></div>';
    return h;
  }

  function doneScreen(){
    var inst = (A.instrument||[]).map(function(k){ return label(S[0],k); }).join(", ") || "-";
    var next = {
      club:["동아리 팀 만들기","팀을 만들고 카톡으로 멤버를 초대해요"],
      crew:["밴드 팀 만들기","팀을 만들고 카톡으로 멤버를 초대해요"],
      seek:["혼자 연습 먼저 시작하기","빈 파트 모집이 열리면 바로 알려드릴게요"],
      solo:["혼자 연습 시작하기","기준 트랙 위에 녹음하고 박자를 확인해요"]
    }[A.band] || ["시작하기",""];
    var dd = A.showDate ? dday(A.showDate) : "";
    var rows = [["악기",inst],["연주 경력",A.career?label(S[1],A.career):"-"],["활동",A.band?label(S[2],A.band).replace(/^네, |^아니요, /,""):"-"]];
    if (dd) rows.push(["공연",dd]);
    rows.push(["가장 아쉬운 점",A.pain?label(S[4],A.pain):"-"]);
    var h = '<div class="hero-ic"><svg width="48" height="48"><use href="#i-check"/></svg></div>';
    h += '<h1 class="q">준비가 끝났어요</h1><p class="hint">'+next[1]+'</p>';
    h += '<div class="summary">'+rows.map(function(r){ return '<div><span>'+r[0]+'</span><b>'+r[1]+'</b></div>'; }).join("")+'</div>';
    h += '<div class="sys"><b>초대 링크로 들어오셨나요?</b>링크를 다시 누르면 그 팀의 곡으로 바로 이동해요</div>';
    return h;
  }

  function dday(v){
    var d = new Date(v+"T00:00:00"), t = new Date(); t.setHours(0,0,0,0);
    var n = Math.round((d - t)/86400000);
    if (isNaN(n)) return "";
    return n > 0 ? "D-"+n : n === 0 ? "D-day" : "이미 지난 날짜예요";
  }

  function answered(s){
    if (s.perm || s.done) return true;
    if (s.multi) return (A[s.id]||[]).length > 0;
    if (s.date && A.show === "yes") return !!A.showDate && dday(A.showDate).indexOf("D") === 0;
    return !!A[s.id];
  }

  function syncUI(){
    var s = S[cur];
    var total = S.filter(function(_,i){ return visible(i); }).length - 1;
    var pos = S.slice(0,cur).filter(function(_,i){ return visible(i); }).length;
    bar.style.width = Math.round(pos/total*100) + "%";
    bar.parentNode.setAttribute("aria-valuenow", Math.round(pos/total*100));
    back.disabled = history.length === 0;
    skip.hidden = !(s.id === "career" || s.id === "pain");
    cta.disabled = !answered(s);
    cta.textContent = s.done ? ({club:"동아리 팀 만들기",crew:"밴드 팀 만들기",seek:"혼자 연습 먼저 시작하기",solo:"혼자 연습 시작하기"}[A.band]||"시작하기") : (s.cta || "다음");
    cta2.hidden = !s.cta2; if (s.cta2) cta2.textContent = s.cta2;
    renderAnswers();
  }

  function renderAnswers(){
    var parts = [];
    if (A.instrument && A.instrument.length) parts.push("악기 "+A.instrument.map(function(k){ return label(S[0],k); }).join("·"));
    if (A.career) parts.push("경력 "+label(S[1],A.career));
    if (A.band) parts.push(label(S[2],A.band));
    if (A.showDate) parts.push("공연 "+dday(A.showDate));
    if (A.pain) parts.push("아쉬운 점: "+label(S[4],A.pain));
    if (A.mic) parts.push("마이크 "+A.mic);
    if (A.push) parts.push("알림 "+A.push);
    document.getElementById("answers").innerHTML = "<b>지금까지 답한 것</b> · " + (parts.join(" / ") || "아직 없음");
  }

  function show(i, dir){
    var old = el;
    el = document.createElement("section");
    el.className = "screen " + (dir < 0 ? "enter-l" : "enter-r");
    el.innerHTML = body(S[i]);
    vp.appendChild(el);
    cur = i;
    bind(el, S[i]);
    syncUI();
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.classList.remove("enter-l","enter-r"); }); });
    if (old) { old.classList.add("leave"); setTimeout(function(){ old.remove(); }, 600); }
    var h = el.querySelector("h1"); if (h) { h.setAttribute("tabindex","-1"); h.focus({preventScroll:true}); }
  }

  function bind(root, s){
    root.querySelectorAll(".opt").forEach(function(b){
      b.addEventListener("click", function(){
        var k = b.dataset.k;
        if (s.multi) {
          var arr = A[s.id] = A[s.id] || [];
          var at = arr.indexOf(k); if (at >= 0) arr.splice(at,1); else arr.push(k);
          b.setAttribute("aria-pressed", String(at < 0));
          syncUI();
          return;
        }
        A[s.id] = k;
        root.querySelectorAll(".opt").forEach(function(x){ x.setAttribute("aria-pressed", String(x === b)); });
        if (s.date) {
          var box = root.querySelector("#datebox");
          box.hidden = k !== "yes";
          if (k !== "yes") delete A.showDate; else root.querySelector("#show-date").focus();
          syncUI();
          if (k !== "yes") setTimeout(go, 450);
          return;
        }
        syncUI();
        setTimeout(go, 450); // 한 개 고르는 질문은 고르면 잠시 뒤 다음 화면으로
      });
    });
    var inp = root.querySelector("#show-date");
    if (inp) {
      var upd = function(){ A.showDate = inp.value; root.querySelector("#dday").textContent = inp.value ? dday(inp.value) : ""; syncUI(); };
      inp.addEventListener("input", upd); upd();
    }
  }

  function go(){
    if (!answered(S[cur])) return;
    if (S[cur].done) { finish(); return; }
    history.push(cur);
    show(nextIndex(cur), 1);
  }

  cta.addEventListener("click", function(){
    var s = S[cur];
    if (s.perm) A[s.id] = "허용";
    go();
  });
  cta2.addEventListener("click", function(){ A[S[cur].id] = "나중에"; history.push(cur); show(nextIndex(cur), 1); });
  skip.addEventListener("click", function(){ history.push(cur); show(nextIndex(cur), 1); });
  back.addEventListener("click", function(){ if (history.length) show(history.pop(), -1); });

  function finish(){
    el.innerHTML = '<div class="hero-ic"><svg width="48" height="48"><use href="#i-users"/></svg></div><h1 class="q">여기서부터 앱 홈이에요</h1><p class="hint">목업은 여기까지예요. 처음부터 다시 보려면 아래 버튼을 누르세요.</p>';
    cta.textContent = "처음부터 다시"; cta.disabled = false; cta2.hidden = true;
    cta.onclick = function(){ location.reload(); };
  }

  show(0, 1);
})();
</script>
</body>
</html>
